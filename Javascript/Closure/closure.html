<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>closure</title>
</head>
<body>
    <h1>closure in js </h1>
</body>

<script>
    function outer(){
        let count = 0;
        function inner(){
            count++;
            console.log(count);
        }
        return inner
    }

    let score = outer() // function expression
    // console.log('score: ', score);
    score()
    score()
    score()
</script>
</html>
