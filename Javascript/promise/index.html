    function payment() {
      return new Promise((resolve, reject) => {
        let status = true;

        setTimeout(() => {
          if (status) {
            resolve("payment successfull");
          } else {
            reject("payemnt failed");
          }
        }, 1000);
      });
    }

    function placeOrder() {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve("order placed");
        }, 1000);
      });
    }

    function delivery() {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve("order on the way");
        }, 1000);
      });
    }

    function done() {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve("orderd delivered successfully . thanks for shopping");
        }, 1000);
      });
    }

      // async/await

      async function orderProcess(){
        try{
          const paymentres =await payment()

          const orderRes = await placeOrder()

          const deliveryres = await delivery()

          const doneRes = await done()
          console.log('doneRes: ', doneRes);



        }catch(err){
          console.log('err: ', err);
        }

      }
